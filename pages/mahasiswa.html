<h1>Daftar Mahasiswa Bimbingan</h1>
<p>Cari mahasiswa, buka laporannya, lalu validasi per minggu setelah semua laporan disetujui pembimbing magang.</p>
<div class="toolbar">
  <input id="cari" type="search" placeholder="Cari nama atau NIM" aria-label="Cari mahasiswa">
  <select id="filterStatus" aria-label="Filter status laporan">
    <option value="">Semua status laporan</option><option value="menunggu">Menunggu</option><option value="disetujui">Disetujui</option><option value="ditolak">Ditolak</option><option value="divalidasi">Divalidasi</option>
  </select>
</div>
<div class="table-wrap"><table class="tbl">
  <thead><tr><th>NIM</th><th>Nama</th><th>Tempat magang</th><th>Tervalidasi</th><th>Aksi</th></tr></thead>
  <tbody id="mhsBody"></tbody>
</table></div>
<section id="detail" class="panel" hidden></section>
