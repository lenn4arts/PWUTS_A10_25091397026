<h1>Input Nilai Dosen</h1>
<p>Nilai akhir diisi satu kali per mahasiswa di akhir magang. Nilai akhir dihitung otomatis (laporan 60%, keaktifan 40%).</p>
<form id="formNilai" class="form panel" action="https://httpbin.org/post" method="post" novalidate>
  <div class="field"><label for="mhs">Mahasiswa</label>
    <select id="mhs" name="magang_id"><option value="">Pilih mahasiswa</option></select>
    <span class="error"></span></div>
  <div id="infoMhs"></div>
  <div class="grid2">
    <div class="field"><label for="nilai_laporan">Nilai laporan</label>
      <input id="nilai_laporan" name="nilai_laporan" type="number" step="0.01" placeholder="0 – 100"><small>Kelengkapan dan kualitas laporan</small><span class="error"></span></div>
    <div class="field"><label for="nilai_keaktifan">Nilai keaktifan</label>
      <input id="nilai_keaktifan" name="nilai_keaktifan" type="number" step="0.01" placeholder="0 – 100"><small>Keaktifan mengisi laporan</small><span class="error"></span></div>
  </div>
  <div class="field"><label for="nilai_akhir">Nilai akhir (otomatis)</label>
    <input id="nilai_akhir" name="nilai_akhir" readonly></div>
  <div class="field"><label for="catatan">Catatan penilaian</label>
    <textarea id="catatan" name="catatan" rows="4" placeholder="Tulis ringkasan penilaian"></textarea><span class="error"></span></div>
  <div class="field"><label class="check"><input type="checkbox" id="setuju" name="setuju"><span>Saya yakin nilai sudah benar. Nilai hanya bisa diisi satu kali.</span></label><span class="error"></span></div>
  <div class="actions"><button type="submit" class="btn btn-primary">Simpan nilai</button><button type="reset" class="btn btn-outline">Kosongkan</button></div>
  <div id="formMsg"></div>
</form>
